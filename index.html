<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafetería</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header class="header">
  Cafetería Rosa
</header>

<nav class="categorias">
  <button onclick="filtrar('bebidas','desayunos','postres')">Todo</button>
  <button onclick="filtrar('bebidas')">Bebidas</button>
  <button onclick="filtrar('desayunos')">Desayunos</button>
  <button onclick="filtrar('postres')">Postres</button>
</nav>

<!-- 🔥 CONTENEDOR PRINCIPAL -->
<div class="contenedor">

  <main id="productos" class="productos"></main>

  <aside class="carrito">
    <h2>Carrito</h2>
    <div id="carritoLista"></div>
    <p id="total"></p>
    <button onclick="pagar()">Pagar</button>
    <button onclick="cancelar()">Cancelar</button>
  </aside>

</div>

<script src="app.js"></script>
</body>
</html>
